<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Share it for all</title>
  <style>
    /* リセット */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ベース */
    :root {
      --primary: #4A90D9;
      --primary-dark: #357ABD;
      --success: #5CB85C;
      --danger: #D9534F;
      --warning: #F0AD4E;
      --text: #333;
      --text-light: #666;
      --bg: #F8F9FA;
      --card-bg: #FFF;
      --border: #DEE2E6;
      --radius: 12px;
      --tap-target: 44px;
      --max-width: 100%;
      --padding: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #E8E8E8;
        --text-light: #AAA;
        --bg: #1A1A2E;
        --card-bg: #16213E;
        --border: #2A2A4A;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    /* レイアウト */
    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--padding);
    }

    @media (min-width: 768px) {
      .container { max-width: 1024px; }
    }

    /* ヘッダー */
    header {
      background: var(--primary);
      color: #FFF;
      padding: 12px var(--padding);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .help-btn {
      width: var(--tap-target);
      height: var(--tap-target);
      border: none;
      background: rgba(255,255,255,0.2);
      color: #FFF;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* カード */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* ボタン */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tap-target);
      padding: 12px 24px;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
      width: 100%;
    }

    .btn:active { opacity: 0.8; }
    .btn-primary { background: var(--primary); color: #FFF; }
    .btn-success { background: var(--success); color: #FFF; }
    .btn-danger { background: var(--danger); color: #FFF; }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* フォーム */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      min-height: var(--tap-target);
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      background: var(--card-bg);
      color: var(--text);
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* エラー */
    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-top: 4px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .alert-error { background: #FDECEA; color: var(--danger); }
    .alert-success { background: #E8F5E9; color: #2E7D32; }
    .alert-info { background: #E3F2FD; color: #1565C0; }

    /* ガイド */
    .guide-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: var(--padding);
    }
    .guide-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 360px;
      width: 100%;
    }
    .guide-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .guide-step-num {
      width: 28px; height: 28px;
      background: var(--primary);
      color: #FFF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* ファイル一覧 */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin: 16px 0;
    }
    .file-item {
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      cursor: pointer;
    }
    .file-item img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .file-item .file-icon {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #EEE;
      font-size: 24px;
    }
    .file-item .file-name {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.6);
      color: #FFF;
      font-size: 10px;
      padding: 2px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* プログレス */
    .progress-bar {
      width: 100%; height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s;
    }

    /* ユーティリティ */
    .text-center { text-align: center; }
    .text-light { color: var(--text-light); }
    .text-small { font-size: 13px; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .mb-16 { margin-bottom: 16px; }
    .gap-12 { gap: 12px; }
    .flex-col { display: flex; flex-direction: column; }
    .hidden { display: none !important; }

    /* ローディング */
    .spinner {
      display: inline-block;
      width: 24px; height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 残り時間バッジ */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-warning { background: #FFF3CD; color: #856404; }
    .badge-info { background: #D1ECF1; color: #0C5460; }

    /* アニメーション無効化 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* フッター */
    footer {
      text-align: center;
      padding: 16px;
      color: var(--text-light);
      font-size: 12px;
    }

    /* 写真編集モーダル */
    .photo-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      display: flex;
      flex-direction: column;
      padding: 8px;
    }
    .photo-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      color: #FFF;
    }
    .photo-modal-header button {
      min-width: var(--tap-target);
      min-height: var(--tap-target);
      background: rgba(255,255,255,0.15);
      border: none;
      color: #FFF;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      padding: 8px 12px;
    }
    .photo-canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .photo-canvas-wrap canvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
    }
    .filter-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0;
      -webkit-overflow-scrolling: touch;
    }
    .filter-chip {
      flex-shrink: 0;
      min-width: 64px;
      min-height: var(--tap-target);
      padding: 8px 12px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: #FFF;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .filter-chip.active {
      border-color: var(--primary);
      background: rgba(74,144,217,0.3);
    }
    .filter-chip.premium {
      border-color: #F0AD4E;
      position: relative;
    }
    .filter-chip.premium::after {
      content: '👑';
      position: absolute;
      top: -6px;
      right: -4px;
      font-size: 10px;
    }
    .photo-actions {
      display: flex;
      gap: 8px;
      padding: 8px 0;
    }
    .photo-actions button {
      flex: 1;
      min-height: var(--tap-target);
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .stamp-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      color: #FFF;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
    }

    /* 閲覧ビューアー */
    .viewer-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      z-index: 300;
      display: flex;
      flex-direction: column;
      touch-action: pan-y;
    }
    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      color: #FFF;
      background: rgba(0,0,0,0.8);
      z-index: 2;
    }
    .viewer-header button {
      min-width: var(--tap-target);
      min-height: var(--tap-target);
      background: rgba(255,255,255,0.15);
      border: none;
      color: #FFF;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      padding: 8px 14px;
    }
    .viewer-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-img-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: visible;
    }
    .viewer-img-container canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .viewer-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 80px;
      background: rgba(255,255,255,0.15);
      border: none;
      color: #FFF;
      font-size: 24px;
      cursor: pointer;
      border-radius: 8px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-nav.prev { left: 8px; }
    .viewer-nav.next { right: 8px; }
    .viewer-counter {
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      padding: 8px;
      background: rgba(0,0,0,0.8);
    }

    /* リアクション */
    .reaction-bar {
      display: flex;
      gap: 4px;
      padding: 10px 8px;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      flex-wrap: wrap;
    }
    .reaction-emoji {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.1);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.15s;
    }
    .reaction-emoji:active { transform: scale(1.3); background: rgba(255,255,255,0.25); }
    .reaction-emoji .count {
      position: absolute;
      bottom: -2px; right: -2px;
      background: var(--primary);
      color: #FFF;
      font-size: 9px;
      border-radius: 8px;
      padding: 1px 4px;
      min-width: 14px;
      text-align: center;
    }
    .reaction-emoji-wrap {
      position: relative;
      display: inline-flex;
    }
    .comment-btn {
      min-width: 44px; height: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.08);
      color: #FFF;
      font-size: 13px;
      cursor: pointer;
      padding: 0 12px;
    }

    /* ポップアップリアクション（写真の周り） */
    .reaction-bubble {
      position: absolute;
      background: rgba(0, 0, 0, 0.75);
      color: #FFF;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 13px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      animation: bubblePop 0.4s ease-out;
      white-space: nowrap;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 5;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .reaction-bubble::after {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      background: rgba(0, 0, 0, 0.75);
      transform: rotate(45deg);
      bottom: -4px;
      left: 20px;
      border-right: 1px solid rgba(255,255,255,0.2);
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .reaction-bubble .bubble-emoji { font-size: 15px; }
    .reaction-bubble .bubble-text { color: #FFF; margin-left: 4px; }
    .reaction-bubble .bubble-name { color: rgba(255,255,255,0.6); font-size: 10px; margin-left: 4px; }
    @keyframes bubblePop {
      0% { transform: scale(0) translateY(10px); opacity: 0; }
      60% { transform: scale(1.1) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* コメント入力モーダル */
    .comment-modal {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-radius: 16px 16px 0 0;
      padding: 20px;
      z-index: 400;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .comment-modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 399;
    }
    .comment-input {
      width: 100%;
      min-height: 44px;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
      resize: none;
      margin-bottom: 12px;
    }
    .name-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .name-toggle input[type="text"] {
      flex: 1;
      min-height: 36px;
      padding: 6px 10px;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }
    .toggle-switch {
      position: relative;
      width: 44px; height: 24px;
      background: #CCC;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle-switch.active { background: var(--primary); }
    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      background: #FFF;
      border-radius: 50%;
      top: 2px; left: 2px;
      transition: transform 0.2s;
    }
    .toggle-switch.active::after { transform: translateX(20px); }

    /* スライドショー */
    .slideshow-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .slideshow-canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.8s ease-in-out;
    }
    .slideshow-canvas.fade-out { opacity: 0; }
    .slideshow-canvas.fade-in { opacity: 1; }
    .slideshow-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      opacity: 1;
      transition: opacity 0.3s;
    }
    .slideshow-overlay.hide-controls .slideshow-controls { opacity: 0; }
    .slideshow-controls button {
      min-width: var(--tap-target);
      min-height: var(--tap-target);
      border: none;
      background: rgba(255,255,255,0.2);
      color: #FFF;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }
    .slideshow-controls button:active { background: rgba(255,255,255,0.4); }
    .slideshow-progress {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(255,255,255,0.2);
    }
    .slideshow-progress-bar {
      height: 100%;
      background: var(--primary);
      transition: width linear;
    }
    .slideshow-counter {
      position: absolute;
      top: 12px;
      right: 12px;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      background: rgba(0,0,0,0.5);
      padding: 4px 10px;
      border-radius: 12px;
    }
    .slideshow-paused {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 64px;
      color: rgba(255,255,255,0.8);
      pointer-events: none;
      animation: pausePulse 0.4s ease-out;
    }
    @keyframes pausePulse {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📸 Share it for all</h1>
    <button class="help-btn" onclick="showGuide()" aria-label="ヘルプ">?</button>
  </header>

  <main id="app" class="container">
    <!-- 画面はJSで動的に描画 -->
  </main>

  <div id="guide-overlay" class="guide-overlay hidden">
    <div class="guide-card">
      <h2 style="margin-bottom:16px; font-size:18px;">📖 使い方</h2>
      <div class="guide-step">
        <span class="guide-step-num">1</span>
        <span>日付と合言葉でスペースを作成</span>
      </div>
      <div class="guide-step">
        <span class="guide-step-num">2</span>
        <span>写真や動画をアップロード</span>
      </div>
      <div class="guide-step">
        <span class="guide-step-num">3</span>
        <span>合言葉を伝えてみんなで共有！</span>
      </div>
      <p class="text-small text-light mb-16">例：日付 260728、合言葉「ワンチャンワンワン」</p>
      <button class="btn btn-primary" onclick="dismissGuide()">はじめる</button>
    </div>
  </div>

  <footer>© 2026 NOK Group — Share it for all</footer>

  <script>
    'use strict';

    // ===== 設定 =====
    const API_BASE = ''; // デプロイ時に設定
    const USE_MOCK = true; // true: ローカルモック版 / false: バックエンドAPI使用
    const RETRY_CONFIG = { maxRetries: 3, baseDelay: 1000, maxDelay: 10000, backoffMultiplier: 2 };

    // ===== IndexedDB モックストレージ =====
    const DB_NAME = 'share_it_db';
    const DB_VERSION = 1;
    let mockDb = null;

    /**
     * IndexedDBを初期化する。
     */
    function initMockDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('spaces')) {
            db.createObjectStore('spaces', { keyPath: 'space_id' });
          }
          if (!db.objectStoreNames.contains('files')) {
            const store = db.createObjectStore('files', { keyPath: 'file_id' });
            store.createIndex('space_id', 'space_id', { unique: false });
          }
        };
        request.onsuccess = (e) => { mockDb = e.target.result; resolve(mockDb); };
        request.onerror = (e) => reject(e);
      });
    }

    /**
     * モックAPIを呼び出す（IndexedDBベース）。
     */
    async function mockApiCall(method, path, body) {
      if (!mockDb) await initMockDb();
      await new Promise(r => setTimeout(r, 200)); // 擬似レイテンシ

      // POST /share-it/spaces — スペース作成
      if (path === '/share-it/spaces' && method === 'POST') {
        const { date_code, keyword, expiry_days } = body;
        // 既存チェック
        const existing = await mockFindSpace(date_code, keyword);
        if (existing) {
          return { status: 'existing', space_id: existing.space_id, date_code, keyword: existing.keyword, keyword_display: keyword.slice(0,2) + '***', expiry_date: existing.expiry_date, is_existing: true };
        }
        // 新規作成
        const space_id = crypto.randomUUID();
        const now = new Date();
        const expiry = new Date(now.getTime() + (expiry_days || 7) * 86400000);
        const space = {
          space_id, date_code, keyword,
          keyword_display: keyword.slice(0,2) + '***',
          expiry_date: expiry.toISOString(),
          created_at: now.toISOString(),
          file_count: 0, total_size: 0
        };
        await mockPutItem('spaces', space);
        return { status: 'created', space_id, date_code, keyword: body.keyword, keyword_display: space.keyword_display, expiry_date: space.expiry_date, is_existing: false };
      }

      // POST /share-it/spaces/access — スペースアクセス
      if (path === '/share-it/spaces/access' && method === 'POST') {
        const { date_code, keyword } = body;
        const space = await mockFindSpace(date_code, keyword);
        if (!space) throw new Error('一致する共有スペースが見つかりませんでした');
        if (new Date(space.expiry_date) < new Date()) throw new Error('この共有スペースは有効期限が過ぎたため、ファイルは利用できません');
        const remaining = mockRemainingTime(space.expiry_date);
        const files = await mockGetFiles(space.space_id);
        return { space_id: space.space_id, date_code, keyword: space.keyword, keyword_display: space.keyword_display, expiry_date: space.expiry_date, file_count: files.length, remaining_time: remaining };
      }

      // POST /share-it/spaces/{spaceId}/upload — アップロードURL（モック: 直接保存）
      if (path.match(/\/share-it\/spaces\/[^/]+\/upload$/) && method === 'POST') {
        const spaceId = path.split('/')[3];
        const { files } = body;
        const uploads = files.map(f => ({ file_id: crypto.randomUUID(), file_name: f.file_name, content_type: f.content_type, file_size: f.file_size, space_id: spaceId }));
        return { uploads, _mock_direct: true };
      }

      // POST /share-it/spaces/{spaceId}/upload/complete
      if (path.match(/\/share-it\/spaces\/[^/]+\/upload\/complete$/) && method === 'POST') {
        const spaceId = path.split('/')[3];
        const files = await mockGetFiles(spaceId);
        return { completed: body.file_ids, file_count: files.length, total_size: files.reduce((s,f) => s + (f.file_size||0), 0) };
      }

      // GET /share-it/spaces/{spaceId}/files
      if (path.match(/\/share-it\/spaces\/[^/]+\/files$/) && method === 'GET') {
        const spaceId = path.split('/')[3];
        const space = await mockGetSpace(spaceId);
        if (!space) throw new Error('スペースが見つかりません');
        const files = await mockGetFiles(spaceId);
        const remaining = mockRemainingTime(space.expiry_date);
        return {
          space_id: spaceId, date_code: space.date_code, keyword: space.keyword, expiry_date: space.expiry_date, remaining_time: remaining,
          file_count: files.length, total_size: files.reduce((s,f) => s + (f.file_size||0), 0),
          files: files.map(f => ({ file_id: f.file_id, file_name: f.file_name, content_type: f.content_type, file_size: f.file_size, uploaded_at: f.uploaded_at, thumbnail_url: f.data_url || null }))
        };
      }

      // GET /share-it/spaces/{spaceId}/files/{fileId}/download
      if (path.match(/\/share-it\/spaces\/[^/]+\/files\/[^/]+\/download$/) && method === 'GET') {
        const parts = path.split('/');
        const fileId = parts[5];
        const file = await mockGetItem('files', fileId);
        if (!file) throw new Error('ファイルが見つかりませんでした');
        return { download_url: file.data_url, file_name: file.file_name, expires_in: 300 };
      }

      // GET /share-it/spaces/{spaceId}/download-all
      if (path.match(/\/share-it\/spaces\/[^/]+\/download-all$/) && method === 'GET') {
        const spaceId = path.split('/')[3];
        const files = await mockGetFiles(spaceId);
        if (!files.length) throw new Error('ダウンロード可能なファイルがありません');
        return { download_url: '_mock_zip_', file_name: 'share-all.zip', file_count: files.length, total_size: files.reduce((s,f) => s + (f.file_size||0), 0), expires_in: 600, _files: files };
      }

      throw new Error('エンドポイントが見つかりません');
    }

    // --- モックDB ヘルパー ---
    function mockPutItem(store, item) {
      return new Promise((resolve, reject) => {
        const tx = mockDb.transaction(store, 'readwrite');
        tx.objectStore(store).put(item);
        tx.oncomplete = resolve;
        tx.onerror = reject;
      });
    }
    function mockGetItem(store, key) {
      return new Promise((resolve, reject) => {
        const tx = mockDb.transaction(store, 'readonly');
        const req = tx.objectStore(store).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = reject;
      });
    }
    function mockGetSpace(spaceId) {
      return mockGetItem('spaces', spaceId);
    }
    function mockFindSpace(dateCode, keyword) {
      return new Promise((resolve, reject) => {
        const tx = mockDb.transaction('spaces', 'readonly');
        const store = tx.objectStore('spaces');
        const req = store.openCursor();
        req.onsuccess = (e) => {
          const cursor = e.target.result;
          if (!cursor) { resolve(null); return; }
          const s = cursor.value;
          if (s.date_code === dateCode && s.keyword === keyword) { resolve(s); return; }
          cursor.continue();
        };
        req.onerror = reject;
      });
    }
    function mockGetFiles(spaceId) {
      return new Promise((resolve, reject) => {
        const tx = mockDb.transaction('files', 'readonly');
        const idx = tx.objectStore('files').index('space_id');
        const req = idx.getAll(spaceId);
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = reject;
      });
    }
    function mockRemainingTime(expiryDate) {
      const remaining = new Date(expiryDate).getTime() - Date.now();
      if (remaining <= 0) return '期限切れ';
      const days = Math.floor(remaining / 86400000);
      const hours = Math.floor((remaining % 86400000) / 3600000);
      const mins = Math.floor((remaining % 3600000) / 60000);
      if (days > 0) return `${days}日 ${hours}時間`;
      if (hours > 0) return `${hours}時間 ${mins}分`;
      return `${mins}分`;
    }

    /**
     * ファイル一覧を描画する。
     */
    function renderFileList(files) {
      const container = document.getElementById('file-list');
      if (!container) return;

      if (files.length === 0) {
        container.innerHTML = '<p class="text-center text-light text-small">ファイルがありません</p>';
        return;
      }

      let html = '<div class="file-grid">';
      for (const file of files) {
        const clickAction = file.thumbnail_url ? `openPhotoEditor('${file.file_id}')` : `handleDownloadFile('${file.file_id}')`;
        // リアクションカウントを取得
        const reactData = localStorage.getItem(`reactions_${file.file_id}`);
        let reactBadge = '';
        if (reactData) {
          const parsed = JSON.parse(reactData);
          const totalEmojis = Object.values(parsed.emojis || {}).reduce((a,b) => a+b, 0);
          const comments = parsed.comments || [];
          const totalComments = comments.filter(c => c.text).length;
          if (totalEmojis > 0 || totalComments > 0) {
            // 上部: 人気絵文字 + カウント
            const topEmojis = Object.entries(parsed.emojis || {}).sort((a,b) => b[1]-a[1]).slice(0, 3).map(e => e[0]).join('');
            reactBadge = `<span style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.75);color:#FFF;border-radius:10px;padding:2px 6px;font-size:11px;z-index:3;">${topEmojis || '💬'} ${totalEmojis + totalComments}</span>`;
            // 最新コメントプレビュー（あれば）
            const lastComment = comments.filter(c => c.text).slice(-1)[0];
            if (lastComment) {
              const preview = lastComment.text.length > 12 ? lastComment.text.slice(0, 12) + '…' : lastComment.text;
              reactBadge += `<span style="position:absolute;top:22px;right:2px;background:rgba(0,0,0,0.7);color:#FFF;border-radius:8px;padding:1px 5px;font-size:9px;z-index:3;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">💬${preview}</span>`;
            }
          }
        }

        if (file.thumbnail_url) {
          html += `
            <div class="file-item" onclick="${clickAction}">
              <img src="${file.thumbnail_url}" alt="${file.file_name}" loading="lazy">
              <span class="file-name">${file.file_name}</span>
              ${reactBadge}
            </div>`;
        } else {
          const icon = file.content_type?.startsWith('video') ? '🎬' : '📄';
          html += `
            <div class="file-item" onclick="${clickAction}">
              <div class="file-icon">${icon}</div>
              <span class="file-name">${file.file_name}</span>
              ${reactBadge}
            </div>`;
        }
      }
      html += '</div>';
      container.innerHTML = html;
    }

    // ===== ファイルアップロード =====
    /**
     * ファイル選択を処理する。
     */
    async function handleFileSelect(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      // バリデーション
      if (files.length > 20) {
        alert('一度にアップロードできるのは20ファイルまでです');
        e.target.value = '';
        return;
      }

      const maxSize = 100 * 1024 * 1024;
      for (const file of files) {
        if (file.size > maxSize) {
          alert(`${file.name}: ファイルサイズは100MB以下にしてください`);
          e.target.value = '';
          return;
        }
      }

      // Presigned URL取得
      const fileInfos = files.map(f => ({
        file_name: f.name,
        content_type: f.type || 'application/octet-stream',
        file_size: f.size
      }));

      try {
        const data = await apiCall('POST', `/share-it/spaces/${appState.spaceId}/upload`, { files: fileInfos });
        const uploads = data.uploads;

        // アップロード実行
        const progressContainer = document.getElementById('upload-progress');
        progressContainer.innerHTML = '';

        const completedIds = [];

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const upload = uploads[i];

          // プログレスバー表示
          const progressEl = document.createElement('div');
          progressEl.innerHTML = `
            <div class="text-small">${file.name}</div>
            <div class="progress-bar"><div class="progress-fill" id="prog-${upload.file_id}" style="width:0%"></div></div>
          `;
          progressContainer.appendChild(progressEl);

          // モックモード: IndexedDBに直接保存
          if (USE_MOCK) {
            const dataUrl = await readFileAsDataURL(file);
            await mockPutItem('files', {
              file_id: upload.file_id,
              space_id: appState.spaceId,
              file_name: file.name,
              content_type: file.type,
              file_size: file.size,
              data_url: dataUrl,
              uploaded_at: new Date().toISOString()
            });
            const bar = document.getElementById(`prog-${upload.file_id}`);
            if (bar) bar.style.width = '100%';
            completedIds.push(upload.file_id);
          } else {
            // 本番: S3に直接アップロード
            const success = await uploadToS3(file, upload.upload_url, upload.file_id);
            if (success) {
              completedIds.push(upload.file_id);
            }
          }
        }

        // 完了通知
        if (completedIds.length > 0) {
          await apiCall('POST', `/share-it/spaces/${appState.spaceId}/upload/complete`, { file_ids: completedIds });
        }

        // ファイル一覧リロード
        await loadFiles(appState.spaceId);
        progressContainer.innerHTML = `<div class="alert alert-success">✅ ${completedIds.length}ファイルのアップロードが完了しました</div>`;
        e.target.value = '';

      } catch (err) {
        alert('アップロードエラー: ' + err.message);
      }
    }

    /**
     * ファイルをDataURL形式で読み込む（モック用）。
     */
    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    /**
     * S3にファイルを直接アップロードする（Presigned PUT URL使用）。
     */
    function uploadToS3(file, uploadUrl, fileId) {
      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', uploadUrl);
        xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) {
            const pct = Math.round((e.loaded / e.total) * 100);
            const bar = document.getElementById(`prog-${fileId}`);
            if (bar) bar.style.width = pct + '%';
          }
        });

        xhr.onload = () => {
          const bar = document.getElementById(`prog-${fileId}`);
          if (bar) bar.style.width = '100%';
          resolve(xhr.status >= 200 && xhr.status < 300);
        };

        xhr.onerror = () => resolve(false);
        xhr.send(file);
      });
    }

    /**
     * 画像にスタンプを焼き込んでDataURLを返す。
     */
    function applyStampToImage(imgSrc) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          drawStamp(ctx, img.width, img.height);
          resolve(canvas.toDataURL('image/jpeg', 0.92));
        };
        img.src = imgSrc;
      });
    }

    // ===== API通信 =====
    /**
     * APIを呼び出す（モック or リアル）。
     */
    async function apiCall(method, path, body = null, retryCount = 0) {
      // モックモードの場合
      if (USE_MOCK) {
        return mockApiCall(method, path, body);
      }

      const options = {
        method,
        headers: { 'Content-Type': 'application/json' },
      };
      if (body) options.body = JSON.stringify(body);

      try {
        const response = await fetch(API_BASE + path, options);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'エラーが発生しました');
        }
        return data;
      } catch (err) {
        if (retryCount < RETRY_CONFIG.maxRetries && err.name === 'TypeError') {
          // ネットワークエラーの場合リトライ
          const delay = Math.min(
            RETRY_CONFIG.baseDelay * Math.pow(RETRY_CONFIG.backoffMultiplier, retryCount),
            RETRY_CONFIG.maxDelay
          );
          await new Promise(r => setTimeout(r, delay));
          return apiCall(method, path, body, retryCount + 1);
        }
        throw err;
      }
    }

    // ===== フォトエディター（フィルター＆スタンプ） =====
    const FILTERS = {
      none: { label: 'オリジナル', free: true },
      grayscale: { label: 'モノクロ', free: true },
      sepia: { label: 'セピア', free: true },
      vintage: { label: 'ビンテージ', free: true },
      vivid: { label: 'ビビッド', free: true },
      pop: { label: 'ポップ', free: false },
      neon: { label: 'ネオン', free: false },
      comic: { label: 'コミック', free: false },
      retrowave: { label: 'レトロ波', free: false },
      dreamy: { label: 'ドリーム', free: false },
      thermal: { label: 'サーモ', free: false },
      glitch: { label: 'グリッチ', free: false },
      sparkle: { label: '✨キラキラ', free: false },
    };

    /**
     * ピクセル操作でフィルターを適用する（iOS Safari完全対応）。
     */
    function applyPixelFilter(ctx, w, h, filterKey) {
      if (filterKey === 'none') return;
      if (filterKey === 'glitch' || filterKey === 'sparkle') return; // 別処理

      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;

      switch (filterKey) {
        case 'grayscale':
          for (let i = 0; i < data.length; i += 4) {
            const avg = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
            data[i] = data[i+1] = data[i+2] = avg;
          }
          break;
        case 'sepia':
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            data[i]   = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
            data[i+1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
            data[i+2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
          }
          break;
        case 'vintage':
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            data[i]   = Math.min(255, r * 0.5 + g * 0.5 + b * 0.2 + 30);
            data[i+1] = Math.min(255, r * 0.2 + g * 0.6 + b * 0.2 + 15);
            data[i+2] = Math.min(255, r * 0.1 + g * 0.3 + b * 0.4);
          }
          break;
        case 'vivid':
          for (let i = 0; i < data.length; i += 4) {
            data[i]   = Math.min(255, Math.max(0, (data[i] - 128) * 1.5 + 128 + 20));
            data[i+1] = Math.min(255, Math.max(0, (data[i+1] - 128) * 1.5 + 128 + 10));
            data[i+2] = Math.min(255, Math.max(0, (data[i+2] - 128) * 1.5 + 128));
          }
          break;
        case 'pop':
          for (let i = 0; i < data.length; i += 4) {
            data[i]   = Math.min(255, Math.max(0, (data[i] - 128) * 1.8 + 128 + 25));
            data[i+1] = Math.min(255, Math.max(0, (data[i+1] - 128) * 1.6 + 128 + 25));
            data[i+2] = Math.min(255, Math.max(0, (data[i+2] - 128) * 1.4 + 128 + 25));
          }
          break;
        case 'neon':
          for (let i = 0; i < data.length; i += 4) {
            data[i]   = Math.min(255, data[i] * 0.5 + 100);
            data[i+1] = Math.min(255, data[i+1] * 1.8);
            data[i+2] = Math.min(255, data[i+2] * 2.0);
          }
          break;
        case 'comic':
          for (let i = 0; i < data.length; i += 4) {
            const avg = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
            const val = avg > 128 ? 255 : (avg > 64 ? 180 : 0);
            data[i] = data[i+1] = data[i+2] = val;
          }
          break;
        case 'retrowave':
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            data[i]   = Math.min(255, r * 0.8 + b * 0.6);
            data[i+1] = Math.min(255, g * 0.3 + 20);
            data[i+2] = Math.min(255, b * 0.6 + r * 0.5 + 40);
          }
          break;
        case 'dreamy':
          for (let i = 0; i < data.length; i += 4) {
            data[i]   = Math.min(255, data[i] * 1.1 + 15);
            data[i+1] = Math.min(255, data[i+1] * 1.05 + 10);
            data[i+2] = Math.min(255, data[i+2] * 1.15 + 20);
          }
          break;
        case 'thermal':
          for (let i = 0; i < data.length; i += 4) {
            const avg = (data[i] + data[i+1] + data[i+2]) / 3;
            if (avg > 200) { data[i] = 255; data[i+1] = 255; data[i+2] = 200; }
            else if (avg > 150) { data[i] = 255; data[i+1] = Math.floor(avg * 0.8); data[i+2] = 0; }
            else if (avg > 100) { data[i] = 255; data[i+1] = 0; data[i+2] = 0; }
            else if (avg > 50) { data[i] = Math.floor(avg * 2); data[i+1] = 0; data[i+2] = 200; }
            else { data[i] = 0; data[i+1] = 0; data[i+2] = Math.floor(avg * 4); }
          }
          break;
      }
      ctx.putImageData(imageData, 0, 0);
    }

    // 特殊フィルター処理（Canvas pixel manipulation）
    function applyGlitchEffect(ctx, w, h) {
      // RGBずらし + ランダムスライス
      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;

      // RGBチャンネルずらし
      const shift = Math.floor(w * 0.02);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w - shift; x++) {
          const i = (y * w + x) * 4;
          const si = (y * w + x + shift) * 4;
          data[i] = data[si]; // Red チャンネルをずらす
        }
      }

      // ランダムスライス（横に数本ずらす）
      for (let s = 0; s < 8; s++) {
        const sliceY = Math.floor(Math.random() * h);
        const sliceH = Math.floor(Math.random() * 20) + 5;
        const sliceShift = Math.floor(Math.random() * 40) - 20;
        for (let y = sliceY; y < Math.min(sliceY + sliceH, h); y++) {
          for (let x = 0; x < w; x++) {
            const srcX = Math.max(0, Math.min(w - 1, x + sliceShift));
            const di = (y * w + x) * 4;
            const si = (y * w + srcX) * 4;
            data[di] = data[si];
            data[di + 1] = data[si + 1];
            data[di + 2] = data[si + 2];
          }
        }
      }
      ctx.putImageData(imageData, 0, 0);

      // スキャンライン
      ctx.fillStyle = 'rgba(0, 255, 200, 0.05)';
      for (let y = 0; y < h; y += 3) {
        ctx.fillRect(0, y, w, 1);
      }
    }

    function applySparkleEffect(ctx, w, h) {
      // キラキラパーティクル
      const sparkleCount = 30;
      for (let i = 0; i < sparkleCount; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const size = Math.random() * 12 + 4;
        const alpha = Math.random() * 0.7 + 0.3;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y);
        ctx.rotate(Math.random() * Math.PI);

        // 4点の星形
        ctx.beginPath();
        ctx.fillStyle = '#FFFFFF';
        const points = 4;
        for (let p = 0; p < points * 2; p++) {
          const r = p % 2 === 0 ? size : size * 0.3;
          const angle = (p * Math.PI) / points;
          const px = Math.cos(angle) * r;
          const py = Math.sin(angle) * r;
          if (p === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        // グロー
        ctx.shadowColor = '#FFFFFF';
        ctx.shadowBlur = size;
        ctx.fill();
        ctx.restore();
      }

      // 虹色レンズフレア（小さめ）
      const gradient = ctx.createRadialGradient(w * 0.7, h * 0.3, 0, w * 0.7, h * 0.3, w * 0.15);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
      gradient.addColorStop(0.3, 'rgba(255, 200, 255, 0.1)');
      gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
    }

    /**
     * フィルター選択UIを描画する。
     */
    function renderFilterStrip() {
      const strip = document.getElementById('filter-strip');
      if (!strip) return;
      let html = '';
      for (const [key, filter] of Object.entries(FILTERS)) {
        const active = key === editorState.currentFilter ? ' active' : '';
        const premium = !filter.free ? ' premium' : '';
        const disabled = (!filter.free && !editorState.isPremium) ? ' style="opacity:0.6"' : '';
        html += `<div class="filter-chip${active}${premium}"${disabled} onclick="applyFilter('${key}')">${filter.label}</div>`;
      }
      strip.innerHTML = html;
    }

    /**
     * フィルターを適用する。
     */
    async function applyFilter(filterKey) {
      const filter = FILTERS[filterKey];
      if (!filter) return;

      // 課金フィルターのチェック
      if (!filter.free && !editorState.isPremium) {
        if (confirm('このフィルターはPro版の機能です。\nPro版を有効にしますか？（デモ: 無料で体験）')) {
          localStorage.setItem('share_it_premium', 'true');
          editorState.isPremium = true;
          // ボタンテキスト更新
          const modal = document.getElementById('photo-editor-modal');
          if (modal) {
            const btns = modal.querySelectorAll('.photo-actions button');
            if (btns[1]) { btns[1].style.background = 'var(--success)'; btns[1].textContent = '📥 スタンプなし保存'; }
          }
        } else {
          return;
        }
      }

      editorState.currentFilter = filterKey;
      renderFilterStrip();
      await drawPhotoOnCanvas();
    }

    /**
     * Canvas に画像を描画する（フィルター適用）。
     */
    async function drawPhotoOnCanvas() {
      const canvas = document.getElementById('photo-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const img = new Image();
      img.crossOrigin = 'anonymous';

      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = editorState.imgSrc;
      });

      // Canvas サイズ設定（最大幅制限）
      const maxW = Math.min(img.width, window.innerWidth - 32);
      const scale = maxW / img.width;
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;

      const w = canvas.width;
      const h = canvas.height;
      const filterKey = editorState.currentFilter;

      // 画像を描画
      ctx.drawImage(img, 0, 0, w, h);

      // フィルター適用（ピクセル操作 — 全ブラウザ対応）
      applyPixelFilter(ctx, w, h, filterKey);

      // 特殊フィルターの後処理
      if (filterKey === 'glitch') {
        applyGlitchEffect(ctx, w, h);
      } else if (filterKey === 'sparkle') {
        applySparkleEffect(ctx, w, h);
      }
    }

    /**
     * スタンプを描画する（合言葉入り — 大きく斜体で目立つ）。
     */
    function drawStamp(ctx, width, height) {
      const space = appState.spaceInfo;
      const dateCode = space?.date_code || '------';
      // マスクなしの合言葉を表示（拡散効果のため）
      const keyword = space?.keyword || space?.keyword_display || '***';

      // 大きめの半透明帯（画像高さの12%、最低60px）
      const bandHeight = Math.max(60, Math.floor(height * 0.12));
      
      // グラデーション帯（より洒落た印象）
      const gradient = ctx.createLinearGradient(0, height - bandHeight, 0, height);
      gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
      gradient.addColorStop(0.3, 'rgba(0, 0, 0, 0.6)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0.8)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, height - bandHeight, width, bandHeight);

      // メインテキスト（大きい斜体）
      const mainFontSize = Math.max(36, Math.min(80, Math.floor(width * 0.08)));
      ctx.font = `italic bold ${mainFontSize}px "Georgia", "Times New Roman", serif`;
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 6;
      ctx.fillText(`Share it ✦ ${keyword}`, width / 2, height - bandHeight * 0.55);

      // サブテキスト（日付）
      const subFontSize = Math.max(14, Math.floor(mainFontSize * 0.4));
      ctx.font = `italic ${subFontSize}px "Georgia", serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.shadowBlur = 3;
      ctx.fillText(`📸 ${dateCode} — shareit-app.com`, width / 2, height - bandHeight * 0.2);

      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    }

    /**

    /**
     * エディター内で絵文字リアクションを追加する。
     */

    /**
     * リアクション絵文字を画像に焼き込む。
     */
    function drawReactionsOnImage(ctx, w, h, fileId) {
      const reactData = localStorage.getItem(`reactions_${fileId}`);
      if (!reactData) return;
      const parsed = JSON.parse(reactData);
      const comments = parsed.comments || [];
      if (comments.length === 0) return;

      // 最新6件を写真の上部に横並びで表示
      const recent = comments.slice(-6);
      const startX = 10;
      const startY = 30;
      const chipH = Math.max(24, Math.floor(h * 0.04));
      const fontSize = Math.max(12, Math.floor(chipH * 0.7));

      recent.forEach((item, i) => {
        const x = startX + (i % 3) * (w * 0.33);
        const y = startY + Math.floor(i / 3) * (chipH + 8);

        // 背景チップ
        const label = item.emoji + (item.text ? ' ' + item.text.slice(0, 8) : '');
        ctx.font = `bold ${fontSize}px sans-serif`;
        const textW = ctx.measureText(label).width + 16;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.beginPath();
        ctx.roundRect(x, y, textW, chipH, chipH / 2);
        ctx.fill();

        ctx.fillStyle = '#FFF';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x + 8, y + chipH / 2);
      });
    }

    /**
     * スタンプ付きで保存する（絵文字入り/なし選択付き）。
     */
    async function downloadWithStamp() {
      const reactions = await getReactions(editorState.fileId);
      const hasReactions = (reactions.comments || []).length > 0;

      let includeReactions = false;
      if (hasReactions) {
        includeReactions = confirm('リアクション（絵文字・コメント）を写真に含めますか？\n\n「OK」→ 絵文字入り\n「キャンセル」→ 絵文字なし');
      }

      const exportCanvas = document.createElement('canvas');
      const ctx = exportCanvas.getContext('2d');
      const img = new Image();
      img.crossOrigin = 'anonymous';
      await new Promise((resolve) => { img.onload = resolve; img.src = editorState.imgSrc; });

      const w = img.width;
      const h = img.height;
      exportCanvas.width = w;
      exportCanvas.height = h;

      ctx.drawImage(img, 0, 0, w, h);
      applyPixelFilter(ctx, w, h, editorState.currentFilter);
      if (editorState.currentFilter === 'glitch') applyGlitchEffect(ctx, w, h);
      if (editorState.currentFilter === 'sparkle') applySparkleEffect(ctx, w, h);

      if (includeReactions) {
        drawReactionsOnImage(ctx, w, h, editorState.fileId);
      }

      drawStamp(ctx, w, h);

      const dataUrl = exportCanvas.toDataURL('image/jpeg', 0.92);
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'shareit_' + editorState.fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

      }

      viewerState = { images, currentIndex: startIndex };

      // モーダル生成
      const viewer = document.createElement('div');
      viewer.id = 'photo-viewer';
      viewer.className = 'viewer-overlay';
      viewer.innerHTML = `
        <div class="viewer-header">
          <button onclick="closeViewer()">✕ 閉じる</button>
          <span id="viewer-filename" style="font-size:12px; opacity:0.8;"></span>

      `;

      // スワイプ対応
      const body = document.getElementById('viewer-body');
      let touchStartX = 0;
      let touchEndX = 0;
      body.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
      body.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) {
          if (diff > 0) viewerNext();
          else viewerPrev();
        }
      }, { passive: true });

      // キーボード操作
      document.addEventListener('keydown', viewerKeyHandler);

      // 最初の画像を表示
      renderViewerImage();

    /**
     * ビューアーを閉じる。
     */
    function closeViewer() {
      const viewer = document.getElementById('photo-viewer');
      if (viewer) viewer.remove();
      document.removeEventListener('keydown', viewerKeyHandler);
    }

    /**
     * キーボードイベント処理。
     */
    function viewerKeyHandler(e) {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); viewerNext(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); viewerPrev(); }
      else if (e.key === 'Escape') { closeViewer(); }
    }

    /**
     * 次の画像へ。
     */
    function viewerNext() {
      if (viewerState.currentIndex < viewerState.images.length - 1) {
        viewerState.currentIndex++;
        renderViewerImage();
      }
    }

    /**
     * 前の画像へ。
     */
    function viewerPrev() {
      if (viewerState.currentIndex > 0) {
        viewerState.currentIndex--;
        renderViewerImage();
      }
    }

    /**
     * ビューアーに画像を描画する（スタンプ帯付き）。
     */
    async function renderViewerImage() {
      const canvas = document.getElementById('viewer-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const imgData = viewerState.images[viewerState.currentIndex];

      const img = new Image();
      await new Promise((resolve) => { img.onload = resolve; img.src = imgData.src; });

      // Canvas サイズ（画面に収まるように）
      const maxW = window.innerWidth - 16;
      const maxH = window.innerHeight - 160;
      let w = img.width;
      let h = img.height;
      const scaleW = maxW / w;
      const scaleH = maxH / h;
      const scale = Math.min(scaleW, scaleH, 1);
      w = Math.floor(w * scale);
      h = Math.floor(h * scale);

      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);

      // スタンプ帯を描画（加工済み写真には重ねない）
      const isAlreadyStamped = imgData.file_name.startsWith('shareit_') || imgData.file_name.startsWith('edited_');
      if (!isAlreadyStamped) {
        // spaceInfoにkeywordがなければIndexedDBから取得
        if (!appState.spaceInfo?.keyword && USE_MOCK && appState.spaceId) {
          const space = await mockGetSpace(appState.spaceId);
          if (space && space.keyword) {
            appState.spaceInfo = { ...appState.spaceInfo, keyword: space.keyword, date_code: space.date_code };
          }
        }
        drawStamp(ctx, w, h);
      }

      // カウンターとファイル名を更新
      const counter = document.getElementById('viewer-counter');
      if (counter) counter.textContent = `${viewerState.currentIndex + 1} / ${viewerState.images.length}`;
      const fname = document.getElementById('viewer-filename');
      if (fname) fname.textContent = imgData.file_name;

      // リアクション表示
      renderReactionBar();
      renderReactionBubbles();
    }

    /**
     * リアクションデータを取得する（IndexedDB）。
     */
    async function getReactions(fileId) {
      const key = `reactions_${fileId}`;
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : { emojis: {}, comments: [] };
    }

      // アニメーション付きバブル追加

        emoji: emoji,
        text: '',

      renderReactionBar();
      renderReactionBubbles();

    /**
     * リアクションバブル（写真周り）を描画する。
     */
    async function renderReactionBubbles() {
      const container = document.getElementById('viewer-img-container');
      if (!container) return;

      // 既存バブルを削除
      container.querySelectorAll('.reaction-bubble').forEach(el => el.remove());

      const imgData = viewerState.images[viewerState.currentIndex];
      const reactions = await getReactions(imgData.file_id);
      const comments = reactions.comments || [];

      // 最新の8件を表示
      const recent = comments.slice(-8);
      const containerRect = container.getBoundingClientRect();
      const w = containerRect.width;
      const h = containerRect.height;

      recent.forEach((item, i) => {
        const bubble = document.createElement('div');
        bubble.className = 'reaction-bubble';

        // 表示内容
        let content = `<span class="bubble-emoji">${item.emoji || '💬'}</span>`;
        if (item.text) content += `<span class="bubble-text">${item.text}</span>`;
        if (item.name) content += `<span class="bubble-name">— ${item.name}</span>`;
        bubble.innerHTML = content;

        // 位置をランダムに散らす（写真の周囲）
        const positions = [
          { top: '5%', left: '5%' },
          { top: '10%', right: '5%' },
          { top: '25%', left: '3%' },
          { top: '30%', right: '3%' },
          { top: '50%', left: '5%' },
          { top: '55%', right: '5%' },
          { top: '70%', left: '3%' },
          { top: '75%', right: '3%' },
        ];
        const pos = positions[i % positions.length];
        Object.assign(bubble.style, pos);
        bubble.style.animationDelay = `${i * 0.1}s`;

        container.appendChild(bubble);
      });
    }

    /**
     * スライドショーを開始する。
     */
    async function startSlideshow() {
      const images = viewerState.images;
      if (!images || images.length === 0) return;

      slideshowState = { running: true, paused: false, timer: null, interval: 4000, index: viewerState.currentIndex };

      // オーバーレイ作成
      const overlay = document.createElement('div');
      overlay.id = 'slideshow-overlay';
      overlay.className = 'slideshow-overlay';
      overlay.innerHTML = `
        <div class="slideshow-progress"><div class="slideshow-progress-bar" id="ss-progress"></div></div>

          <button onclick="stopSlideshow()">✕</button>
        </div>
      `;
      document.body.appendChild(overlay);

      // タップで一時停止/再開
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay || e.target.tagName === 'CANVAS') {
          toggleSlideshow();
        }
      });

      // フルスクリーン試行
      try {
        if (overlay.requestFullscreen) await overlay.requestFullscreen();
        else if (overlay.webkitRequestFullscreen) await overlay.webkitRequestFullscreen();
      } catch (e) { /* フルスクリーン非対応でも続行 */ }

      // 最初の画像を表示
      await renderSlideshowImage();
      scheduleSlideshowNext();
    }

    /**
     * スライドショーを停止する。
     */
    function stopSlideshow() {
      slideshowState.running = false;
      clearTimeout(slideshowState.timer);

      // フルスクリーン解除
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();

      const overlay = document.getElementById('slideshow-overlay');
      if (overlay) overlay.remove();
    }

    /**
     * 一時停止/再開トグル。
     */
    function toggleSlideshow() {
      if (!slideshowState.running) return;
      const btn = document.getElementById('ss-play-btn');
      const overlay = document.getElementById('slideshow-overlay');

      if (slideshowState.paused) {
        // 再開
        slideshowState.paused = false;
        if (btn) btn.textContent = '⏸';
        // 一時停止アイコンを消す
        const pauseIcon = overlay?.querySelector('.slideshow-paused');
        if (pauseIcon) pauseIcon.remove();
        scheduleSlideshowNext();
      } else {
        // 一時停止
        slideshowState.paused = true;
        clearTimeout(slideshowState.timer);
        if (btn) btn.textContent = '▶️';
        // 一時停止アイコン表示
        if (overlay) {
          const icon = document.createElement('div');
          icon.className = 'slideshow-paused';
          icon.textContent = '⏸';
          overlay.appendChild(icon);
        }
      }
    }

    /**
     * 次の画像に切り替える。
     */
    async function slideshowNext() {
      const images = viewerState.images;
      slideshowState.index = (slideshowState.index + 1) % images.length;
      await transitionSlideshowImage();
      if (!slideshowState.paused) scheduleSlideshowNext();
    }

    /**
     * 前の画像に切り替える。
     */
    async function slideshowPrev() {
      const images = viewerState.images;
      slideshowState.index = (slideshowState.index - 1 + images.length) % images.length;
      await transitionSlideshowImage();
      if (!slideshowState.paused) scheduleSlideshowNext();
    }

    /**
     * 次の画像切り替えをスケジュールする。
     */
    function scheduleSlideshowNext() {
      clearTimeout(slideshowState.timer);
      // プログレスバー
      const bar = document.getElementById('ss-progress');
      if (bar) {
        bar.style.transition = 'none';
        bar.style.width = '0%';
        requestAnimationFrame(() => {
          bar.style.transition = `width ${slideshowState.interval}ms linear`;
          bar.style.width = '100%';
        });
      }
      slideshowState.timer = setTimeout(() => slideshowNext(), slideshowState.interval);
    }

    const SPEED_OPTIONS = [
      { label: '2秒', value: 2000 },
      { label: '4秒', value: 4000 },
      { label: '6秒', value: 6000 },
      { label: '8秒', value: 8000 },
    ];
    let speedIndex = 1; // デフォルト4秒

    /**
     * スライドショー速度を切り替える。
     */
    function cycleSpeed() {
      speedIndex = (speedIndex + 1) % SPEED_OPTIONS.length;
      const speed = SPEED_OPTIONS[speedIndex];
      slideshowState.interval = speed.value;
      const btn = document.getElementById('ss-speed-btn');
      if (btn) btn.textContent = speed.label;
      // 現在のタイマーをリセットして新しい速度で再スケジュール
      if (!slideshowState.paused) {
        scheduleSlideshowNext();
      }
    }

    /**
     * フェードトランジション付きで画像を切り替える。
     */
    async function transitionSlideshowImage() {
      const canvas = document.getElementById('ss-canvas');
      if (!canvas) return;

      // フェードアウト
      canvas.classList.remove('fade-in');
      canvas.classList.add('fade-out');
      await new Promise(r => setTimeout(r, 400));

      // 画像描画
      await renderSlideshowImage();

      // フェードイン
      canvas.classList.remove('fade-out');
      canvas.classList.add('fade-in');
    }

    /**
     * スライドショーのCanvasに画像を描画する。
     */
    async function renderSlideshowImage() {
      const canvas = document.getElementById('ss-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const images = viewerState.images;
      const imgData = images[slideshowState.index];

      const img = new Image();
      await new Promise((resolve) => { img.onload = resolve; img.src = imgData.src; });

      // 画面サイズに合わせる
      const maxW = window.innerWidth;
      const maxH = window.innerHeight;
      let w = img.width, h = img.height;
      const scale = Math.min(maxW / w, maxH / h, 1);
      w = Math.floor(w * scale);
      h = Math.floor(h * scale);

      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);

      // スタンプ（加工済みでなければ）
      const isStamped = imgData.file_name.startsWith('shareit_') || imgData.file_name.startsWith('edited_');
      if (!isStamped) {
        if (!appState.spaceInfo?.keyword && USE_MOCK && appState.spaceId) {
          const space = await mockGetSpace(appState.spaceId);
          if (space && space.keyword) {
            appState.spaceInfo = { ...appState.spaceInfo, keyword: space.keyword, date_code: space.date_code };
          }
        }
        drawStamp(ctx, w, h);
      }

      // カウンター更新
      const counter = document.getElementById('ss-counter');
      if (counter) counter.textContent = `${slideshowState.index + 1} / ${images.length}`;
    }

    /**
     * 加工済み写真をスペースにシェア（再アップロード）する。
     */
    async function shareToSpace() {
      const exportCanvas = document.createElement('canvas');
      const ctx = exportCanvas.getContext('2d');
      const img = new Image();
      img.crossOrigin = 'anonymous';
      await new Promise((resolve) => { img.onload = resolve; img.src = editorState.imgSrc; });

      const w = img.width;
      const h = img.height;
      exportCanvas.width = w;
      exportCanvas.height = h;

      ctx.drawImage(img, 0, 0, w, h);
      applyPixelFilter(ctx, w, h, editorState.currentFilter);
      if (editorState.currentFilter === 'glitch') applyGlitchEffect(ctx, w, h);
      if (editorState.currentFilter === 'sparkle') applySparkleEffect(ctx, w, h);

      // スタンプ付きで保存
      drawStamp(ctx, w, h);

      // DataURLを取得
      const dataUrl = exportCanvas.toDataURL('image/jpeg', 0.92);
      const filterLabel = FILTERS[filterKey]?.label || '';
      const newFileName = `edited_${filterLabel}_${editorState.fileName}`;

      // IndexedDBに保存（モック）
      if (USE_MOCK) {
        const fileId = crypto.randomUUID();
        // DataURLからサイズを概算
        const sizeEstimate = Math.floor(dataUrl.length * 0.75);
        await mockPutItem('files', {
          file_id: fileId,
          space_id: appState.spaceId,
          file_name: newFileName,
          content_type: 'image/jpeg',
          file_size: sizeEstimate,
          data_url: dataUrl,
          uploaded_at: new Date().toISOString()
        });
      }

      // エディターを閉じてファイル一覧をリロード
      closePhotoEditor();
      await loadFiles(appState.spaceId);
      alert('✅ 加工済み写真をスペースにシェアしました！');
    }

    // ===== ヘルパー =====
    function showFieldError(id, msg) {
      const el = document.getElementById(id);
      if (el) { el.textContent = msg; el.classList.remove('hidden'); }
    }
    function hideError(id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    }
    function showAlert(id, msg) {
      const el = document.getElementById(id);
      if (el) { el.textContent = msg; el.classList.remove('hidden'); }
    }
  </script>
</body>
